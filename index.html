<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar Highlight Viewer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Noto+Sans:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --bg:        #0d0d0f;
      --surface:   #16161a;
      --border:    #2a2a32;
      --text:      #e8e6e1;
      --muted:     #6b6a72;
      --hl:        #f5c542;
      --hl-dim:    rgba(245, 197, 66, 0.12);
      --accent:    #7c6af7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── Load screen ── */
    #load-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }
    #load-screen h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    #file-input {
      display: none;
    }
    .file-btn {
      padding: 10px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: .95rem;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .file-btn:hover {
      border-color: var(--accent);
      background: #1e1e26;
    }
    .hint {
      font-size: .8rem;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Viewer ── */
    #viewer {
      display: none;
      width: 100%;
      max-width: 900px;
      padding: 0 40px;
      position: relative;
      min-height: 100vh;
      flex-direction: column;
      justify-content: center;
      gap: 0;
    }

    .caption-block {
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding: 40px 0;
    }

    .line {
      font-size: 2.6rem;
      line-height: 1.35;
      font-family: 'Noto Sans SC', 'Noto Sans', sans-serif;
      font-weight: 400;
      letter-spacing: .02em;
      user-select: none;
    }

    .line.trans {
      font-size: 1.85rem;
      font-family: 'Noto Sans', sans-serif;
      color: #a09ea8;
    }

    .line span.hl {
      color: var(--hl);
      font-weight: 700;
      position: relative;
    }

    /* underline for the phrase group — used for trans only */
    .line.trans span.hl-phrase {
      text-decoration: underline;
      text-decoration-color: rgba(245, 197, 66, 0.45);
      text-underline-offset: 5px;
    }

    /* ── Literal box ── */
    #literal-box {
      position: fixed;
      bottom: 32px;
      right: 36px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--hl);
      border-radius: 6px;
      padding: 14px 18px;
      max-width: 280px;
      font-family: 'JetBrains Mono', monospace;
      font-size: .8rem;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .2s, transform .2s;
      pointer-events: none;
    }
    #literal-box.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Nav controls ── */
    #nav {
      position: fixed;
      bottom: 32px;
      left: 36px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: .75rem;
      color: var(--muted);
    }
    #nav button {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: .75rem;
      padding: 5px 10px;
      cursor: pointer;
      transition: border-color .15s;
    }
    #nav button:hover { border-color: var(--accent); }
    #nav button:disabled { opacity: .3; cursor: default; }

    #progress {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--border);
    }
    #progress-bar {
      height: 100%;
      background: var(--accent);
      transition: width .15s;
    }
  </style>
</head>
<body>

<div id="load-screen">
  <h1>Grammar Highlight Viewer</h1>
  <label class="file-btn" for="file-input">Load JSON file</label>
  <input type="file" id="file-input" accept=".json">
  <p class="hint">← → or space to advance · backspace to go back</p>
</div>

<div id="viewer" style="display:none; flex-direction:column; justify-content:center;">
  <div id="progress"><div id="progress-bar"></div></div>
  <div class="caption-block">
    <div class="line orig" id="orig-line"></div>
    <div class="line trans" id="trans-line"></div>
  </div>
  <div id="literal-box"></div>
  <div id="nav">
    <button id="btn-prev" disabled>← prev</button>
    <span id="counter">0 / 0</span>
    <button id="btn-next">next →</button>
  </div>
</div>

<script>
  let frames = [];
  let idx = 0;

  // ── File loading ──
  document.getElementById('file-input').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        frames = data.frames;
        if (!frames || !frames.length) { alert('No frames found in JSON.'); return; }
        idx = 0;
        document.getElementById('load-screen').style.display = 'none';
        document.getElementById('viewer').style.display = 'flex';
        render();
      } catch(err) {
        alert('Failed to parse JSON: ' + err.message);
      }
    };
    reader.readAsText(file);
  });

  // ── Render ──
  function render() {
    const frame = frames[idx];
    const { orig, trans, focus } = frame;
    const { orig_span, trans_span, literal } = focus;

    // Original line: highlight char range
    const origEl = document.getElementById('orig-line');
    origEl.innerHTML =
      esc(orig.slice(0, orig_span[0])) +
      `<span class="hl">${esc(orig.slice(orig_span[0], orig_span[1]))}</span>` +
      esc(orig.slice(orig_span[1]));

    // Translation line: highlight word range
    const words = trans.split(' ');
    const [ws, we] = trans_span;
    const transHtml = words.map((w, i) => {
      if (i === ws && i === we - 1) return `<span class="hl">${esc(w)}</span>`;
      if (i === ws)     return `<span class="hl hl-phrase">${esc(w)}`;
      if (i === we - 1) return `${esc(w)}</span>`;
      if (i > ws && i < we) return esc(w);
      return esc(w);
    }).join(' ');
    document.getElementById('trans-line').innerHTML = transHtml;

    // Literal box
    const box = document.getElementById('literal-box');
    box.textContent = literal || '';
    box.classList.toggle('visible', !!literal);

    // Nav
    document.getElementById('counter').textContent = `${idx + 1} / ${frames.length}`;
    document.getElementById('btn-prev').disabled = idx === 0;
    document.getElementById('btn-next').disabled = idx === frames.length - 1;

    // Progress
    const pct = frames.length > 1 ? (idx / (frames.length - 1)) * 100 : 100;
    document.getElementById('progress-bar').style.width = pct + '%';
  }

  function esc(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function go(delta) {
    const next = idx + delta;
    if (next < 0 || next >= frames.length) return;
    idx = next;
    render();
  }

  // ── Controls ──
  document.getElementById('btn-prev').addEventListener('click', () => go(-1));
  document.getElementById('btn-next').addEventListener('click', () => go(1));

  document.addEventListener('keydown', e => {
    if (frames.length === 0) return;
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); }
    if (e.key === 'ArrowLeft'  || e.key === 'Backspace') { e.preventDefault(); go(-1); }
  });
</script>
</body>
</html>
